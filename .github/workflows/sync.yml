name: Sync documentation

on:
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: docs-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run docs:sync
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: npm test
      - run: npm run docs:build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sync-link-report
          path: .cache/*-report.json
      - uses: peter-evans/create-pull-request@v7
        with:
          branch: automation/sync-documentation
          commit-message: 'docs: synchronize product documentation'
          title: 'docs: update imported product documentation'
          body: |
            Updates the approved documentation sources and their pinned revisions.

            Validation: link and inventory checks, importer tests, and production site build.
            Review sources.lock.json and the workflow source-link report alongside the content changes.
          add-paths: |
            content/products/
            content/repositories.md
            sources.lock.json
