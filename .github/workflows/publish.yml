name: Publish documentation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run docs:build
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: source-link-report
          path: .cache/*-report.json
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          path: content/.vitepress/dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # The Pages site is created once out of band (POST /repos/:owner/:repo/pages with build_type=workflow,
      # or Settings > Pages > Source: GitHub Actions). The enablement input is deliberately left at its default
      # because creating a site needs repository administration rights, which GITHUB_TOKEN cannot be granted:
      # with enablement enabled the step fails with "Create Pages site failed ... Resource not accessible by
      # integration". This step only reads the existing site configuration.
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
